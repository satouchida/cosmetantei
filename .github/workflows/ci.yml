name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # pnpm のバージョンは package.json の packageManager から読む
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # テストは fetch と Cloudflare バインディングをスタブに置き換えて実行するため、秘密情報は不要
      - run: pnpm test
      # ビルドでだけ見つかる失敗（App Router の決まり・サーバー専用のモジュールの読み込みなど）を、deploy の前に見つける
      - run: pnpm build
