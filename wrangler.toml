name = "cosmetantei"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static Assets
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Custom Domain Configuration (cosmetantei)
# routes = [
#   { pattern = "cosmetantei.com/*", custom_domain = true },
#   { pattern = "app.cosmetantei.com/*", custom_domain = true }
# ]

# レート制限（src/lib/server/cloudflare.ts で使用）
# namespace_id はアカウント内で一意な任意の数値。事前のリソース作成は不要です
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Workers AI（ブランド名チェックで Clef モデル @cf/cloudflare/clef を使用。src/lib/services/brand-check.ts）
# 注意: wrangler dev でも AI バインディングは Cloudflare 上のモデルを呼び出すため、利用料金が発生します
[ai]
binding = "AI"

# KV キャッシュ（Gemini応答・成分AI解説・語句判定・バーコード照合結果）
# 未設定の場合はアイソレート単位のインメモリキャッシュで動作します
# 有効化手順: `npx wrangler kv namespace create APP_CACHE` を実行し、表示された id を貼り付けてコメントを外す
# [[kv_namespaces]]
# binding = "APP_CACHE"
# id = "<namespace id>"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
NEXT_PUBLIC_AMAZON_AFFILIATE_TAG = "cosmetantei-22"

# Cloudflare本番環境でのAPIキー設定:
# ターミナルで `npx wrangler secret put GEMINI_API_KEY` を実行して設定します
