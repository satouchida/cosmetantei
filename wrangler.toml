name = "cosmetantei"
# OpenNext の worker.js に、アプリの Durable Object を足したエントリー
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# 独自ドメイン（cosmetantei.app）。表（[...]）より前に書く（後ろに書くと、その表の中の設定になり無視される）。
# ドメインの zone をこの Cloudflare アカウントに追加してから有効にする
# （zone が無いまま有効にすると deploy が失敗する）。有効にしたら、Turnstile のウィジェットにも cosmetantei.app を足す。
# www は cosmetantei.app へ転送するだけ（next.config.mjs の redirects）。Turnstile に www を足す必要はない
routes = [
  { pattern = "cosmetantei.app", custom_domain = true },
  { pattern = "www.cosmetantei.app", custom_domain = true }
]
# workers.dev のアドレスも開発用に残す（routes を書くと、書かない限り止まる）。検索には出さない（next.config.mjs の noindex）
workers_dev = true
# 版ごとのプレビュー用アドレス（<版>-cosmetantei.….workers.dev）は使わない。noindex の対象外のアドレスを増やさない
preview_urls = false

# Workers Logs（[usage] の費用の記録・エラーを保存して検索できるようにする）。ログには利用者の文章を出さない
# （件数・ハッシュ・状態コードだけ。docs/walkthroughs/2026-10-14-cost-tracking.md）
[observability]
enabled = true
head_sampling_rate = 1

# 要求ごとの記録（invocation logs）は残さない。要求のアドレス（入力途中の検索語 ?q=…）・IP アドレスが入るため
# （プライバシーポリシー第2条第1号・第4条第4号）。console の [usage] の行とエラーは残る
[observability.logs]
enabled = true
invocation_logs = false

# レート制限（src/lib/server/cloudflare.ts で使用）
# namespace_id はアカウント内で一意な任意の数値。事前のリソース作成は不要です
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# 価格の検索（1回で Web 検索と Gemini のページ読み取りを何回も使う）
[[ratelimits]]
name = "PRICE_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# ブラウザの確認（Turnstile のトークンを Cloudflare に確かめ、セッションを発行する。src/lib/server/session.ts）
[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# お店の商品検索（ブランドの製品一覧）。無料だが、楽天・Yahoo! の回数は全員で1分 50 回まで（1人で使い切らせない）。
# IP は携帯の回線・会社で多くの人が同じになるので多めに、セッション（ブラウザ）ごとは少なく
[[ratelimits]]
name = "SHOP_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "SHOP_SESSION_RATE_LIMITER"
namespace_id = "1007"
simple = { limit = 6, period = 60 }

# 有料の呼び出し（Gemini・Workers AI・Web 検索）の上限を、全世界で1つの Durable Object で厳密に数える
# （src/lib/server/spend-cap.ts）。クラスは worker.ts から export している。上限は [vars] の SPEND_BUDGET_USD・SPEND_PER_MINUTE_*
[[durable_objects.bindings]]
name = "SPEND_CAP"
class_name = "SpendCapObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpendCapObject"]

# 有料の呼び出し（Gemini・Workers AI・Web 検索）の利用量（src/lib/server/usage.ts）。
# 件数・トークン数・所要時間だけを書く。集計の SQL は docs/walkthroughs/2026-10-14-cost-tracking.md
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "cosmetantei_usage"

# Workers AI（ブランド名チェックで Clef モデル @cf/cloudflare/clef を使用。src/lib/services/brand-check.ts）
# 注意: wrangler dev でも AI バインディングは Cloudflare 上のモデルを呼び出すため、利用料金が発生します
[ai]
binding = "AI"

# KV キャッシュ（Gemini応答・成分AI解説・ブランド判定・バーコード照合・検索結果・成分確認済み製品）
# namespace: APP_CACHE。wrangler dev / preview ではローカルの模擬 KV（.wrangler/ 配下）を使用します
# このブロックを外すと、アイソレート単位のインメモリキャッシュで動作します
[[kv_namespaces]]
binding = "APP_CACHE"
id = "2afbe688816d43f998dc380861d4b9f7"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
NEXT_PUBLIC_AMAZON_AFFILIATE_TAG = "cosmetantei22-22"
# Gemini と Clef は Cloudflare AI Gateway 経由で呼び出す（ローカルは .dev.vars で cosmetantei-dev に上書き）
CLOUDFLARE_ACCOUNT_ID = "abd3843a83776fc9f73f65bb4bc2265e"
AI_GATEWAY_ID = "cosmetantei-prod"
# チャットゲート（Clef）: enforce | shadow | off。雑談・指示の書き換え・本人の医療相談を Gemini の前で止める
# この判定はキーワードでは代替できないため enforce で運用する（docs/plans/gemini-role-redesign.md）
CHAT_GATE_MODE = "enforce"
# 有料の呼び出しの予算（全体で厳密に数える）。Gemini・Workers AI・Web 検索の合計金額で「1日あたり/1か月あたり」の USD（UTC）。
# 超える呼び出しはせず、利用量の記録に capped と残す。単価は src/lib/server/prices.ts、詳細は
# docs/walkthroughs/2026-10-14-cost-tracking.md の「Budget」
SPEND_BUDGET_USD = "10/100"
# 利用者（IP。IPv6 は /48）ごとの1日あたりの上限（USD）。1人で全員の予算を使い切れないように。
# "0" は「上限なし」ではなく、利用者からの有料の呼び出しをすべて断る
SPEND_PER_CLIENT_USD = "0.5"
# 発行してからこの分数までの Turnstile のセッションは、上限をこの額（USD/日）にする。Turnstile を解く業者で
# 新しいセッションを次々に作られても、1つあたりの額を小さくする。製品を Web で1回調べられる額（$0.30 前後）は残す
SPEND_PER_NEW_SESSION_USD = "0.3"
SPEND_NEW_SESSION_MINUTES = "30"
# IP を並べて予算を使い切られないよう、まとめて数える上限（USD/日）。IPv4 の /24（隣り合う 256 個）ごとと、
# クラウドの事業者（src/lib/server/hosting-networks.ts）ごと
SPEND_PER_NETWORK_USD = "2"
SPEND_PER_HOSTING_NETWORK_USD = "1"
# 今日の全体の合計が予算のこの割合に達したら、利用者ごとの上限（IP・/24・事業者・セッション）をこの % に下げる
SPEND_TIGHTEN_AFTER_SHARE = "0.5"
SPEND_TIGHTENED_PERCENT = "30"
# ブラウザの確認（Cloudflare Turnstile）。ダッシュボードで作ったウィジェットのサイトキー（公開してよい値）。
# 空なら使わない（IP ごとの予算だけ）。設定したら、秘密情報も wrangler secret put で設定する（無ければ有料の API を断る）:
#   pnpm exec wrangler secret put TURNSTILE_SECRET_KEY   （ウィジェットの秘密キー）
#   pnpm exec wrangler secret put SESSION_SECRET         （セッションの Cookie の署名。32文字以上のランダムな文字列）
TURNSTILE_SITE_KEY = "0x4AAAAAAFZpjmtvFBd8swaZ"
# 急増を止める、種類ごとの1分あたりの件数
SPEND_PER_MINUTE_WEB_SEARCH = "30"
SPEND_PER_MINUTE_GEMINI = "60"
SPEND_PER_MINUTE_WORKERS_AI = "120"
# 急がない仕事（成分の AI 評価・成分表示の翻訳）が使える、1分あたりの件数の割合。残りはチャットの返事などのために空けておく
SPEND_BACKGROUND_SHARE = "0.5"
# 楽天・Yahoo! の API（無料）。アプリ ID ごとに1秒に1回までの規約に合わせ、全体で1分あたりの件数を数える
SPEND_PER_MINUTE_RAKUTEN_API = "50"
SPEND_PER_MINUTE_YAHOO_API = "50"
# 1回の要求で確保してよい有料の呼び出しの見積もりの合計（ドル）。60 秒を過ぎたら新しい有料の呼び出しはしない
SPEND_PER_REQUEST_USD = "0.3"
# 楽天の API に送る Origin。楽天のアプリに登録したサイトでないと 403 になる
RAKUTEN_API_ORIGIN = "https://cosmetantei.app"
# 検索結果の Clef フィルター: off | shadow | enforce。既定は off（2026-10-13 の評価で、今の検索結果に取り除く候補が無かったため）
# docs/plans/clef-chat-gate-and-search-filter.md の Phase 2
SEARCH_FILTER_MODE = "off"
# Web の製品を全員で共有するのは、信頼するサイト（src/lib/data/trusted-sites.ts）のものだけにする。
# shadow: 今までどおり動き、出典のホスト名と判定だけを [trusted-sites] のログに出す / enforce: 共有を絞る / off
TRUSTED_SITES_MODE = "shadow"
# アフィリエイト（docs/plans/shop-prices.md）。ID を取得したら設定する。未設定ならリンクは商品ページそのもの
RAKUTEN_AFFILIATE_ID = "3ce8fce4.34db538d.3ce8fce5.5c648f7b"
# Yahoo!ショッピング：バリューコマースの MyLink（{url} に商品ページの URL が入る）
YAHOO_AFFILIATE_LINK_TEMPLATE = "https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3784886&pid=892728177&vc_url={url}"
# 使うときは、アフィリエイトの表示（src/lib/site.ts の AFFILIATE_DISCLOSURE）とプライバシーポリシーにも ASP を足す
# COSME_AFFILIATE_LINK_TEMPLATE = "ASP のリンクの雛形（{url} に商品ページの URL が入る）"

# Gemini の APIキーはアプリに持たせず、AI Gateway の Provider Keys（Google AI Studio）に保存しています。
# AI で使う秘密情報は AI Gateway の認証トークン CF_AIG_TOKEN のみ。[vars] にも .env 系のファイルにも書かないでください。
#   本番:                                                        pnpm exec wrangler secret put CF_AIG_TOKEN
#   pnpm dev / wrangler dev / opennextjs-cloudflare preview:  .dev.vars
# お店の API キー（楽天・Yahoo!）も秘密情報として同じように設定する:
#   pnpm exec wrangler secret put RAKUTEN_APPLICATION_ID / RAKUTEN_ACCESS_KEY / YAHOO_CLIENT_ID
